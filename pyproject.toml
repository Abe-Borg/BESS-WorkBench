[project]
name = "bess-workbench"
version = "0.1.0"
description = "Design aid for lithium-ion BESS / ESS rooms in US hyperscale data centers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BESS WorkBench contributors" }]
dependencies = [
  "PySide6>=6.6",
  "pydantic>=2.6",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.1",
  "anthropic>=0.40",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pypdf>=5.0", "pyinstaller>=6.0"]

[project.scripts]
bess-workbench = "bess_workbench.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bess_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bess_workbench --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
source = ["bess_workbench"]
omit = [
  "bess_workbench/ui/*",
  "bess_workbench/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
